<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salary Prediction App</title>
  <style>
    /* Background styling */
    /* --- Main Background and Structure --- */
.main-background {
    background-color: #0A192F; /* Deep Navy Blue */
    font-family: 'Arial', sans-serif; /* A clear, modern font */
    color: #CCD6F6; /* Light Gray for general text */
}

/* --- The Main Card Container --- */
.card-container {
    background-color: #172A45; /* Dark Gray */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); /* Stronger shadow for depth */
    border-radius: 8px;
    padding: 30px;
}

/* --- App Titles and Headers --- */
.app-title {
    color: #ffa764; /* Light Mint/Aqua */
    text-shadow: 0 0 5px #ffbe64; /* Subtle glow effect */
}

/* --- Input Field --- */
.input-field {
    background-color: #0A192F; /* Same as body for blending */
    color: #FFFFFF; /* Pure White input text */
    border: 1px solid #64FFDA; /* Mint border */
    border-radius: 4px;
    padding: 10px;
}

/* --- Predict Button --- */
.predict-button {
    background-color: #172A45; /* Darker background */
    color: #64FFDA; /* Light Mint text/icon */
    border: 2px solid #64FFDA; /* Strong border */
    transition: all 0.3s ease; /* Smooth hover effect */
}

.predict-button:hover {
    background-color: #64FFDA20; /* Subtle hover color */
    cursor: pointer;
}

/* --- Predicted Salary Result Box --- */
.result-box {
    background-color: #303C58; /* Slightly brighter dark gray */
    color: #64FFDA; /* Main text color */
    padding: 15px;
    border-radius: 6px;
    border-left: 5px solid #64FFDA; /* A highlight bar */
}

.salary-value {
    color: #FFFFFF; /* Pure white for the main salary number */
    font-size: 2.5em;
    font-weight: bold;
}
